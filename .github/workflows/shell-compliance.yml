name: SHELL Compliance

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1" # Weekly Monday 6:30pm SGT, after config sync window

concurrency:
  group: shell-compliance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  compliance:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      SHELL_IDENTITY: ${{ secrets.SHELL_IDENTITY }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate GitHub CLI
        run: |
          echo "${GH_PAT}" | gh auth login --with-token
          gh auth setup-git

      - name: Convert policy maps to JSON
        shell: bash
        run: |
          ruby -ryaml -rjson -e '
            tiers_raw = YAML.safe_load(
              File.read("tiers.yml"),
              permitted_classes: [],
              permitted_symbols: [],
              aliases: false
            ) || {}

            tiers_out = {}
            ["external", "archived", "showcase", "standard"].each do |tier|
              values = tiers_raw[tier] || []
              unless values.is_a?(Array)
                raise "tiers.yml #{tier} must be a list"
              end
              tiers_out[tier] = values.select { |value| value.is_a?(String) }
            end

            File.write(".github/tiers.generated.json", JSON.pretty_generate(tiers_out))

            repos_raw = YAML.safe_load(
              File.read("repos.yml"),
              permitted_classes: [],
              permitted_symbols: [],
              aliases: false
            ) || {}
            repos = repos_raw.key?("repos") ? repos_raw["repos"] : repos_raw
            unless repos.is_a?(Hash)
              raise "repos.yml must be a mapping"
            end
            repo_policy = {}
            repos.each do |full_name, settings|
              next unless full_name.is_a?(String) && settings.is_a?(Hash)
              visibility = settings["visibility"]
              next unless visibility.is_a?(String)
              normalized = visibility.strip.downcase
              next unless ["public", "private"].include?(normalized)
              repo_policy[full_name] = { "visibility" => normalized }
            end
            File.write(".github/repo-policy.generated.json", JSON.pretty_generate(repo_policy))
          '

      - name: Clone repos and collect compliance data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          WORK = ROOT / ".shell-compliance-work"
          RESULTS = ROOT / ".shell-compliance-results"
          WORK.mkdir(exist_ok=True)
          RESULTS.mkdir(exist_ok=True)

          def run(cmd, cwd=None):
              return subprocess.run(
                  cmd,
                  cwd=str(cwd) if cwd else None,
                  capture_output=True,
                  text=True,
                  errors="replace",
              )

          tiers = json.loads((ROOT / ".github" / "tiers.generated.json").read_text(encoding="utf-8"))
          repos = []
          for tier in ("archived", "showcase", "standard"):
              for full_name in tiers.get(tier, []):
                  if "/" in full_name and full_name not in repos:
                      repos.append(full_name)

          for full_name in repos:
              safe_name = full_name.replace("/", "__")
              target = WORK / safe_name
              if target.exists():
                  shutil.rmtree(target)
              clone = run(["gh", "repo", "clone", full_name, str(target), "--", "--depth", "1"])
              repo_result = {
                  "repo": full_name,
                  "clone": {"returncode": clone.returncode, "stderr": clone.stderr[-2000:]},
              }
              if clone.returncode == 0:
                  scan = run(["python", "tools/scan_identity.py", str(target), "--json"])
                  history = run(["python", "tools/scan_identity.py", str(target), "--json", "--history"])
                  check = run(["python", "tools/check_repo.py", str(target), "--json"])
                  repo_result["scan_command"] = {"returncode": scan.returncode, "stderr": scan.stderr[-2000:]}
                  repo_result["history_command"] = {"returncode": history.returncode, "stderr": history.stderr[-2000:]}
                  repo_result["check_command"] = {"returncode": check.returncode, "stderr": check.stderr[-2000:]}
                  repo_result["scan"] = json.loads(scan.stdout) if scan.stdout.strip().startswith("{") else {"error": scan.stderr[-2000:]}
                  repo_result["history"] = json.loads(history.stdout) if history.stdout.strip().startswith("{") else {"error": history.stderr[-2000:]}
                  repo_result["check"] = json.loads(check.stdout) if check.stdout.strip().startswith("{") else {"error": check.stderr[-2000:]}
              (RESULTS / f"{safe_name}.json").write_text(json.dumps(repo_result, indent=2), encoding="utf-8")
          PY

      - name: Write COMPLIANCE.md
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results = []
          for path in sorted(Path(".shell-compliance-results").glob("*.json")):
              results.append(json.loads(path.read_text(encoding="utf-8")))
          repo_policy = {}
          policy_path = Path(".github/repo-policy.generated.json")
          if policy_path.is_file():
              repo_policy = json.loads(policy_path.read_text(encoding="utf-8"))

          def expected_visibility(repo: str) -> str:
              configured = repo_policy.get(repo, {}).get("visibility")
              return "private" if configured == "private" else "public"

          def actual_visibility(item: dict) -> str:
              gh = item.get("check", {}).get("github", {})
              if isinstance(gh, dict) and gh.get("isPrivate") is True:
                  return "private"
              if isinstance(gh, dict) and gh.get("isPrivate") is False:
                  return "public"
              return "unknown"

          def command_errors(item: dict) -> list[str]:
              errors = []
              clone = item.get("clone", {})
              if clone.get("returncode") != 0:
                  errors.append(f"clone exited {clone.get('returncode')}")
              for name in ("scan", "history", "check"):
                  command = item.get(f"{name}_command")
                  if command and command.get("returncode") not in (0, 1):
                      errors.append(f"{name} exited {command.get('returncode')}")
                  payload = item.get(name, {})
                  if isinstance(payload, dict) and payload.get("error"):
                      errors.append(f"{name}: {str(payload.get('error')).splitlines()[0][:160]}")
              return errors

          fail_counts = {rule: 0 for rule in ("R1", "R2", "R3", "R4", "R5", "R6")}
          identity_rows = []
          history_rows = []
          no_licence = []
          visibility_rows = []
          error_rows = []

          lines = [
              "# SHELL Compliance",
              "",
              "Generated by `.github/workflows/shell-compliance.yml`.",
              "",
              "## Matrix",
              "",
              "| Repo | R1 | R2 | R3 | R4 | R5 | R6 |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for item in results:
              repo = item["repo"]
              rules = item.get("check", {}).get("rules", {})
              scan_payload = item.get("scan", {})
              scan_hits = scan_payload.get("hits", []) if isinstance(scan_payload, dict) else []
              scan_ok = isinstance(scan_payload, dict) and "error" not in scan_payload
              row = [repo]
              for rule in ("R1", "R2", "R3", "R4"):
                  state = rules.get(rule, {}).get("ok")
                  cell = "pass" if state is True else "fail" if state is False else "n/a"
                  if cell == "fail":
                      fail_counts[rule] += 1
                  row.append(cell)
              r5_cell = "pass" if scan_ok and len(scan_hits) == 0 else "fail"
              if r5_cell == "fail":
                  fail_counts["R5"] += 1
              row.append(r5_cell)
              state = rules.get("R6", {}).get("ok")
              r6_cell = "pass" if state is True else "fail" if state is False else "n/a"
              if r6_cell == "fail":
                  fail_counts["R6"] += 1
              row.append(r6_cell)
              lines.append("| " + " | ".join(row) + " |")
              if rules.get("R1", {}).get("ok") is False:
                  no_licence.append(repo)
              for hit in scan_hits:
                  identity_rows.append((repo, hit.get("path"), hit.get("line"), hit.get("category")))
              history_hits = [
                  hit for hit in item.get("history", {}).get("hits", [])
                  if str(hit.get("path", "")).startswith("history@")
              ]
              for hit in history_hits:
                  history_rows.append((repo, hit.get("path"), hit.get("category")))
              expected = expected_visibility(repo)
              actual = actual_visibility(item)
              if actual != "unknown" and actual != expected:
                  visibility_rows.append((repo, expected, actual))
              for error in command_errors(item):
                  error_rows.append((repo, error))

          lines += ["", "## Identity Hits", ""]
          current_repo = None
          for repo, path, line, category in identity_rows:
              if repo != current_repo:
                  lines.append(f"### {repo}")
                  current_repo = repo
              lines.append(f"- `{path}:{line}` [{category}]")

          lines += ["", "## History Hits - Requires Owner Decision", ""]
          current_repo = None
          for repo, path, category in history_rows:
              if repo != current_repo:
                  lines.append(f"### {repo}")
                  current_repo = repo
              lines.append(f"- `{path}` [{category}]")

          lines += ["", "## Repos With No Licence", ""]
          for repo in no_licence:
              lines.append(f"- {repo}")

          lines += ["", "## Visibility Drift", ""]
          for repo, expected, actual in visibility_rows:
              lines.append(f"- {repo}: expected {expected}, actual {actual}")

          lines += ["", "## Command Errors", ""]
          for repo, error in error_rows:
              lines.append(f"- {repo}: {error}")

          lines += ["", "## Current Descriptions", ""]
          for item in results:
              desc = item.get("check", {}).get("github", {}).get("description") or ""
              lines.append(f"- **{item['repo']}**: {desc}")

          Path("COMPLIANCE.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          issue_needed = any(fail_counts.values()) or identity_rows or history_rows or no_licence or visibility_rows or error_rows
          issue_lines = [
              "# SHELL Compliance Drift",
              "",
              "Managed by `.github/workflows/shell-compliance.yml`.",
              "",
              "## Summary",
              "",
              "- R1-R6 failures: " + ", ".join(f"{rule}={count}" for rule, count in fail_counts.items()),
              f"- Working-tree identity hits: {len(identity_rows)}",
              f"- History hits requiring owner decision: {len(history_rows)}",
              f"- Repos with no licence: {len(no_licence)}",
              f"- Visibility drift items: {len(visibility_rows)}",
              f"- Command errors: {len(error_rows)}",
              "",
              "See `COMPLIANCE.md` for the full matrix. Matched identity values are never included.",
          ]
          if history_rows:
              issue_lines += ["", "## History Owner Decision Required", ""]
              for repo, path, category in history_rows:
                  issue_lines.append(f"- {repo}: `{path}` [{category}]")
          if visibility_rows:
              issue_lines += ["", "## Visibility Drift", ""]
              for repo, expected, actual in visibility_rows:
                  issue_lines.append(f"- {repo}: expected {expected}, actual {actual}")
          if error_rows:
              issue_lines += ["", "## Command Errors", ""]
              for repo, error in error_rows:
                  issue_lines.append(f"- {repo}: {error}")
          Path(".github/compliance-issue.md").write_text("\n".join(issue_lines) + "\n", encoding="utf-8")
          Path(".github/compliance-issue-state").write_text("open\n" if issue_needed else "close\n", encoding="utf-8")
          PY

      - name: Open or update compliance issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          title="SHELL compliance drift"
          label="shell-compliance"
          gh label create "$label" --color "B60205" --description "Managed SHELL compliance issue" 2>/dev/null || true
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" --json number --jq '.[0].number // empty')"
          state="$(cat .github/compliance-issue-state)"
          if [ "$state" = "open" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file .github/compliance-issue.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file .github/compliance-issue.md --label "$label"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Compliance drift resolved by latest weekly report."
          fi

      - name: Commit compliance report
        shell: bash
        run: |
          if [ -n "$(git status --porcelain COMPLIANCE.md)" ]; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions Compliance"
            git add COMPLIANCE.md
            git commit -m "chore(shell): update compliance report [skip ci]"
            git push
          fi
