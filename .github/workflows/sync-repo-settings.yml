name: Sync Repo Settings & General Config to All Repos

# COST-OPTIMISED (2026-07-04) + INCLUDES-ARCHIVED (2026-07-06):
# - Removed `push` trigger — every workflow edit was re-running the full 90-repo
#   sync, which then triggered every workflow in every target repo (cascade).
#   Now the sync only runs on the weekly schedule or when manually dispatched.
# - Added `concurrency` to prevent overlapping runs stacking up.
# - **Now processes archived repos too** by temporarily unarchiving → applying
#   changes → re-archiving. Disabled repos are still skipped (they cannot
#   accept API writes at all).
on:
  workflow_dispatch:
    inputs:
      include_archived:
        description: "Include archived repos (unarchive → sync → re-archive)"
        type: boolean
        default: true
  schedule:
    - cron: "0 9 * * 1" # Weekly Monday 5pm SGT

concurrency:
  group: sync-repo-settings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Weekly schedule always includes archived. Manual runs use the input flag.
  INCLUDE_ARCHIVED: ${{ github.event_name == 'schedule' && 'true' || inputs.include_archived }}

jobs:
  configure-repo-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const owner = '${{ github.repository_owner }}';
            const includeArchived = ${{ env.INCLUDE_ARCHIVED }} === true || '${{ env.INCLUDE_ARCHIVED }}' === 'true';
            const maxRetries = 3;
            const retryStatuses = new Set([429, 500, 502, 503, 504]);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const withRetry = async (fn) => {
              let lastError;
              for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const status = error.status || error.code;
                  if (!retryStatuses.has(status) || attempt === maxRetries) {
                    throw error;
                  }
                  const waitMs = Math.min(8000, 1000 * 2 ** (attempt - 1));
                  await sleep(waitMs);
                }
              }
              throw lastError;
            };
            const repos = await withRetry(() =>
              github.paginate(github.rest.repos.listForAuthenticatedUser, {
                per_page: 100,
                affiliation: 'owner'
              })
            );
            console.log(`Found ${repos.length} repositories; includeArchived=${includeArchived}`);
            const failures = [];
            for (const repo of repos) {
              if (repo.disabled) {
                console.log(`Skipping disabled repo: ${repo.name}`);
                continue;
              }
              if (repo.archived && !includeArchived) {
                console.log(`Skipping archived repo (per input): ${repo.name}`);
                continue;
              }
              const wasArchived = repo.archived;
              try {
                if (wasArchived) {
                  console.log(`Temporarily unarchiving: ${repo.name}`);
                  await withRetry(() =>
                    github.rest.repos.update({ owner, repo: repo.name, archived: false })
                  );
                }
                console.log(`Configuring settings for: ${repo.name}`);
                const isTheprawn = repo.name.toLowerCase().includes('theprawn');
                await withRetry(() =>
                  github.rest.repos.update({
                    owner,
                    repo: repo.name,
                    private: !isTheprawn,
                    description: "Give me 1 ⭐ if it's cool.",
                    homepage: "https://www.hong-yi.me",
                    has_issues: true,
                    has_wiki: true,
                    has_projects: true,
                    has_discussions: true,
                    allow_auto_merge: true,
                    delete_branch_on_merge: true,
                    allow_squash_merge: true,
                    allow_merge_commit: true,
                    allow_rebase_merge: true,
                    allow_forking: true,
                    web_commit_signoff_required: false,
                    has_downloads: true,
                    has_pages: false
                  })
                );
                console.log(`✅ Successfully configured settings for: ${repo.name}`);
              } catch (error) {
                console.log(`❌ Failed to configure ${repo.name}: ${error.message}`);
                failures.push(repo.name);
              } finally {
                if (wasArchived) {
                  try {
                    await withRetry(() =>
                      github.rest.repos.update({ owner, repo: repo.name, archived: true })
                    );
                    console.log(`🔒 Re-archived: ${repo.name}`);
                  } catch (e) {
                    console.log(`⚠️  Failed to re-archive ${repo.name}: ${e.message} — DO THIS MANUALLY`);
                    failures.push(`${repo.name} (re-archive failed)`);
                  }
                }
              }
            }
            if (failures.length > 0) {
              console.log(`Settings failures: ${failures.join(', ')}`);
            }
            console.log('Repository settings configuration complete!');

  propagate-secrets:
    runs-on: ubuntu-latest
    needs: configure-repo-settings
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh
      - name: Authenticate gh CLI
        run: echo "${GH_PAT}" | gh auth login --with-token
      - name: Set GH_PAT secret in all repos (including archived)
        run: |
          # gh secret set works on archived repos without needing to unarchive.
          gh api --paginate "user/repos?per_page=100&affiliation=owner" --jq '.[] | select(.disabled==false) | .full_name' \
          | while IFS= read -r repo; do
              echo "$GH_PAT" | gh secret set GH_PAT --repo "$repo" && echo "Set GH_PAT: $repo" || echo "Failed: $repo"
            done

  force-sync-general-config:
    runs-on: ubuntu-latest
    needs: propagate-secrets
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      INCLUDE_ARCHIVED: ${{ github.event_name == 'schedule' && 'true' || inputs.include_archived }}
      # NOTE: All target-repo commits are made with `[skip ci]` in the message
      # so they do NOT fan-out and trigger CI/CodeQL/Scorecard in every downstream
      # repo. This was the biggest single source of Actions-minute waste.
      SYNC_ITEMS: |
        .github/dependabot_config.yml|.github/dependabot.yml
        .deepsource.toml|.deepsource.toml
        .sourcery.yml|.sourcery.yml
        .github/workflows/trufflehog.yml|.github/workflows/trufflehog.yml
        .github/workflows/dependabot-auto-merge.yml|.github/workflows/dependabot-auto-merge.yml
        .github/workflows/auto-merge-bots.yml|.github/workflows/auto-merge-bots.yml
        .github/workflows/summary.yml|.github/workflows/summary.yml
        .github/workflows/codeql.yml|.github/workflows/codeql.yml
        .github/workflows/scorecard.yml|.github/workflows/scorecard.yml
        .github/workflows/dependency-review.yml|.github/workflows/dependency-review.yml
        .github/workflows/ci.yml|.github/workflows/ci.yml
        .github/ISSUE_TEMPLATE/bug_report.md|.github/ISSUE_TEMPLATE/bug_report.md
        .github/ISSUE_TEMPLATE/feature_request.md|.github/ISSUE_TEMPLATE/feature_request.md
        .github/pull_request_template.md|.github/pull_request_template.md
        CONTRIBUTING.md|CONTRIBUTING.md
        SECURITY.md|SECURITY.md
        .gitattributes|.gitattributes
        .github/labels.yml|.github/labels.yml
        .github/workflows/labeler.yml|.github/workflows/labeler.yml
        .github/greetings.yml|.github/greetings.yml
        .github/workflows/greetings.yml|.github/workflows/greetings.yml
        .github/FUNDING.yml|.github/FUNDING.yml
        AGENTS.md|AGENTS.md
        .github/workflows/heartbeat.yml|.github/workflows/heartbeat.yml
        .github/workflows/lfs-guard.yml|.github/workflows/lfs-guard.yml
      COMMIT_MESSAGE: |
        chore(config): sync from sourcerepo [skip ci]
      PR_TITLE: |
        Sync General Configurations
      PR_BODY: |
        Automated config sync from source repo.
    steps:
      - uses: actions/checkout@v4
      - name: Install jq and GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh
      - name: Authenticate gh CLI
        run: |
          echo "${GH_PAT}" | gh auth login --with-token
          gh auth setup-git
      - name: Sync General Config
        shell: bash
        run: bash .github/scripts/sync-selected-paths.sh
