name: Sync Skills to All Repos
on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/sync-selected-paths.sh'
  workflow_dispatch:
  schedule:
    - cron: "40 */3 * * *"
jobs:
  force-sync-skills:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      SYNC_ITEMS: ""
      COMMIT_MESSAGE: |
        chore(sync): remove AI tool dirs and update .gitignore
      PR_TITLE: |
        Sync: Remove AI tool directories
      PR_BODY: |
        Removes dot tool directories, skills/, docs/, templates/ from git tracking and updates .gitignore.
    steps:
      - uses: actions/checkout@v6
      - name: Install jq and GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh
      - name: Authenticate gh CLI
        run: |
          echo "${GH_PAT}" | gh auth login --with-token
          gh auth setup-git
      - name: Sync Skills
        shell: bash
        run: bash .github/scripts/sync-selected-paths.sh
