name: Sync Skills to All Repos
on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'skills-lock.json'
      - 'docs/skills-manifest.md'
      - '.github/scripts/sync-selected-paths.sh'
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"
jobs:
  force-sync-skills:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      SYNC_ITEMS: |
        skills|skills
        skills-lock.json|skills-lock.json
        docs/skills-manifest.md|docs/skills-manifest.md
      COMMIT_MESSAGE: |
        feat(skills): sync skills from sourcerepo
      PR_TITLE: |
        Update Skills
      PR_BODY: |
        Automated skills sync from sourcerepo. Removes AI tool dot directories and updates .gitignore.
    steps:
      - uses: actions/checkout@v4
      - name: Install jq and GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh
      - name: Authenticate gh CLI
        run: |
          echo "${GH_PAT}" | gh auth login --with-token
          gh auth setup-git
      - name: Sync Skills
        shell: bash
        run: bash .github/scripts/sync-selected-paths.sh
