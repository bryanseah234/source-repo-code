# .github/workflows/sync.yml
name: Force Sync Config Files to Main Branch
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *" # Daily at 11 PM SGT (15:00 UTC) to catch new repos

jobs:
  configure-repo-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Configure All Repository Settings
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const owner = 'bryanseah234';
            const maxRetries = 3;
            const retryStatuses = new Set([429, 500, 502, 503, 504]);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const withRetry = async (fn) => {
              let lastError;
              for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const status = error.status || error.code;
                  if (!retryStatuses.has(status) || attempt === maxRetries) {
                    throw error;
                  }
                  const waitMs = Math.min(8000, 1000 * 2 ** (attempt - 1));
                  await sleep(waitMs);
                }
              }
              throw lastError;
            };

            // Get all repositories for the user
            const repos = await withRetry(() =>
              github.paginate(github.rest.repos.listForAuthenticatedUser, {
                per_page: 100,
                affiliation: 'owner'
              })
            );

            console.log(`Found ${repos.length} repositories to configure`);
            const failures = [];

            for (const repo of repos) {
              // Skip archived repos
              if (repo.archived || repo.disabled) {
                console.log(`Skipping archived or disabled repo: ${repo.name}`);
                continue;
              }
              
              try {
                console.log(`Configuring settings for: ${repo.name}`);
                
                // Update repository settings
                await withRetry(() =>
                  github.rest.repos.update({
                    owner: owner,
                    repo: repo.name,
                    description: "Give me 1 ⭐ if it's cool.",
                    homepage: "https://www.hong-yi.me",
                    has_issues: true,
                    has_wiki: true,
                    has_projects: true,
                    has_discussions: true
                  })
                );
                
                console.log(`✅ Successfully configured settings for: ${repo.name}`);
              } catch (error) {
                console.log(`❌ Failed to configure ${repo.name}: ${error.message}`);
                failures.push(repo.name);
              }
            }

            if (failures.length > 0) {
              console.log(`Settings failures: ${failures.join(', ')}`);
            }
            console.log('Repository settings configuration complete! ');

  force-sync:
    runs-on: ubuntu-latest
    needs: configure-repo-settings
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4.1.7

      - name: Install jq and GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Authenticate gh CLI
        run: |
          echo "${GH_PAT}" | gh auth login --with-token
          gh auth setup-git

      - name: Force Sync Files to All Repos
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Sync"

          OWNER=${{ github.repository_owner }}
          SOURCE_REPO_NAME=${{ github.event.repository.name }}
          WORKDIR="$(pwd)"
          SYNC_ROOT="$(mktemp -d)"
          FAILED_REPOS=()
          PUSH_FAILED_REPOS=()

          retry() {
            local attempts=0
            local max_attempts=3
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge "$max_attempts" ]; then
                return 1
              fi
              sleep $((2 ** attempts))
            done
          }

          REPOS_JSON="$(gh api --paginate "user/repos?per_page=100&affiliation=owner" | jq -s 'add')"
          echo "Owner: $OWNER"
          echo "Source repo: $SOURCE_REPO_NAME"
          echo "Found repos: $(echo "$REPOS_JSON" | jq length)"

          while read -r repo; do
            REPO_NAME="$(echo "$repo" | jq -r '.name')"
            ARCHIVED="$(echo "$repo" | jq -r '.archived')"
            DISABLED="$(echo "$repo" | jq -r '.disabled')"
            FORKED="$(echo "$repo" | jq -r '.fork')"
            DEFAULT_BRANCH="$(echo "$repo" | jq -r '.default_branch')"

            if [ "$ARCHIVED" = "true" ] || [ "$DISABLED" = "true" ] || [ "$FORKED" = "true" ]; then
              echo "Skipping repo: $REPO_NAME"
              continue
            fi

            if [ "$REPO_NAME" = "$SOURCE_REPO_NAME" ]; then
              echo "Skipping source repo: $REPO_NAME"
              continue
            fi

            TARGET_DIR="$SYNC_ROOT/$REPO_NAME"
            echo "Processing $REPO_NAME..."

            if ! retry gh repo clone "$OWNER/$REPO_NAME" "$TARGET_DIR" -- --depth 1; then
              echo "Failed to clone $OWNER/$REPO_NAME, skipping."
              FAILED_REPOS+=("$REPO_NAME")
              continue
            fi

            cd "$TARGET_DIR" || {
              FAILED_REPOS+=("$REPO_NAME")
              continue
            }

            mkdir -p .github/workflows

            SRC_BASE="$WORKDIR"

            copy_if_exists() {
              local src="$1"
              local dst="$2"
              if [ -f "$src" ]; then
                cp -f "$src" "$dst"
                echo "Copied $src -> $dst"
              else
                echo "Source missing, skipping copy: $src"
              fi
            }

            copy_if_exists "$SRC_BASE/.github/dependabot_config.yml" ".github/dependabot.yml"
            copy_if_exists "$SRC_BASE/.deepsource.toml" ".deepsource.toml"
            copy_if_exists "$SRC_BASE/.sourcery.yml" ".sourcery.yml"
            copy_if_exists "$SRC_BASE/.github/workflows/trufflehog.yml" ".github/workflows/trufflehog.yml"
            copy_if_exists "$SRC_BASE/.github/labels.yml" ".github/labels.yml"
            copy_if_exists "$SRC_BASE/.github/workflows/labeler.yml" ".github/workflows/labeler.yml"
            copy_if_exists "$SRC_BASE/.github/greetings.yml" ".github/greetings.yml"
            copy_if_exists "$SRC_BASE/.github/workflows/greetings.yml" ".github/workflows/greetings.yml"
            copy_if_exists "$SRC_BASE/.github/FUNDING.yml" ".github/FUNDING.yml"

            git add -A

            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "feat(config): Standardize CI/CD configurations via sync workflow"
              if retry git push origin HEAD:"$DEFAULT_BRANCH"; then
                echo "Pushed changes to $REPO_NAME"
              else
                SYNC_BRANCH="sync-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                git checkout -b "$SYNC_BRANCH"
                if git push origin "$SYNC_BRANCH"; then
                  gh pr create --repo "$OWNER/$REPO_NAME" --title "Sync CI/CD configs" --body "Automated config sync." --base "$DEFAULT_BRANCH" --head "$SYNC_BRANCH" || true
                  echo "Opened PR for $REPO_NAME"
                else
                  echo "Push failed for $REPO_NAME"
                  PUSH_FAILED_REPOS+=("$REPO_NAME")
                fi
              fi
            else
              echo "No changes needed in $REPO_NAME, skipping push."
            fi

            cd "$WORKDIR" || exit
            rm -rf "$TARGET_DIR"
          done < <(echo "$REPOS_JSON" | jq -c '.[] | {name, archived, disabled, fork, default_branch}')

          if [ "${#FAILED_REPOS[@]}" -gt 0 ]; then
            echo "Clone failures: ${FAILED_REPOS[*]}"
          fi
          if [ "${#PUSH_FAILED_REPOS[@]}" -gt 0 ]; then
            echo "Push failures: ${PUSH_FAILED_REPOS[*]}"
          fi
