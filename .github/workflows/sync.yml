# .github/workflows/sync.yml
name: Force Sync Config Files to Main Branch
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC to catch new repos

jobs:
  configure-repo-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Configure All Repository Settings
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const owner = 'bryanseah234';

            // Get all repositories for the user
            const repos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
              per_page: 100,
              affiliation: 'owner'
            });

            console.log(`Found ${repos.length} repositories to configure`);

            for (const repo of repos) {
              // Skip archived repos
              if (repo.archived) {
                console.log(`Skipping archived repo: ${repo.name}`);
                continue;
              }
              
              try {
                console.log(`Configuring settings for: ${repo.name}`);
                
                // Update repository settings
                await github.rest.repos.update({
                  owner: owner,
                  repo: repo.name,
                  description: "Give me 1 ⭐ if it's cool.",
                  homepage: "https://www.hong-yi.me",
                  has_issues: true,
                  has_wiki: true,
                  has_projects: true,
                  has_discussions: true
                });
                
                console.log(`✅ Successfully configured settings for: ${repo.name}`);
              } catch (error) {
                console.log(`❌ Failed to configure ${repo.name}: ${error.message}`);
              }
            }

            console.log('Repository settings configuration complete! ');

  force-sync:
    runs-on: ubuntu-latest
    needs: configure-repo-settings
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Install jq and GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Authenticate gh CLI
        run: |
          echo "${GH_PAT}" | gh auth login --with-token
          gh auth setup-git

      - name: Force Sync Files to All Repos
        run: |
          # Proper git config keys
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Sync"

          # Get list of repo names for the authenticated user
          REPOS=$(gh repo list --limit 9999 --json name | jq -r '.[].name')
          OWNER=${{ github.repository_owner }}
          SOURCE_REPO_NAME=${{ github.event.repository.name }}

          echo "Owner: $OWNER"
          echo "Source repo: $SOURCE_REPO_NAME"
          echo "Found repos: $(echo "$REPOS" | wc -l)"

          for REPO_NAME in $REPOS; do
            TARGET_DIR="../$REPO_NAME"
            echo "Processing $REPO_NAME..."

            # Clone into a sibling directory
            gh repo clone "$OWNER/$REPO_NAME" "$TARGET_DIR" || {
              echo "Failed to clone $OWNER/$REPO_NAME, skipping."
              continue
            }
            cd "$TARGET_DIR" || continue

            # Ensure target directories exist
            mkdir -p .github/workflows

            # Copy files from the source repository if they exist.
            SRC_BASE="../$SOURCE_REPO_NAME"

            copy_if_exists() {
              local src="$1"
              local dst="$2"
              if [ -f "$src" ]; then
                cp -f "$src" "$dst"
                echo "Copied $src -> $dst"
              else
                echo "Source missing, skipping copy: $src"
              fi
            }

            copy_if_exists "$SRC_BASE/.github/dependabot.yml" ".github/dependabot.yml"
            copy_if_exists "$SRC_BASE/.deepsource.toml" ".deepsource.toml"
            copy_if_exists "$SRC_BASE/.sourcery.yml" ".sourcery.yml"
            copy_if_exists "$SRC_BASE/.github/workflows/trufflehog.yml" ".github/workflows/trufflehog.yml"
            copy_if_exists "$SRC_BASE/.github/labels.yml" ".github/labels.yml"
            copy_if_exists "$SRC_BASE/.github/workflows/labeler.yml" ".github/workflows/labeler.yml"
            copy_if_exists "$SRC_BASE/.github/greetings.yml" ".github/greetings.yml"
            copy_if_exists "$SRC_BASE/.github/workflows/greetings.yml" ".github/workflows/greetings.yml"
            copy_if_exists "$SRC_BASE/.github/FUNDING.yml" ".github/FUNDING.yml"

            # Stage changes (use -A to include added/removed files)
            git add -A

            # Check for any changes to commit
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "feat(config): Standardize CI/CD configurations via sync workflow"
              # Push will use gh's credential helper from auth above
              if git push origin HEAD; then
                echo "Pushed changes to $REPO_NAME"
              else
                 echo "Push failed for $REPO_NAME"
              fi
            else
              echo "No changes needed in $REPO_NAME, skipping push."
            fi

            # Go back to workspace
            cd - >/dev/null || exit

            # Cleanup to save space
            echo "cleaning up $TARGET_DIR..."
            rm -rf "$TARGET_DIR"
          done
