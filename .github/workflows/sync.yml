# .github/workflows/force-sync.yml in your source repo
name: Force Sync Config Files to Main Branch
on:
  push:
    branches:
      - main

jobs:
  force-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install jq -y
        
      - name: Force Sync Files to All Repos
        run: |
          # Configure git for the commit signature
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Sync"

          # Use GitHub CLI to list all user repositories
          REPOS=$(gh repo list --limit 9999 --json name | jq -r '.[].name')
          OWNER=${{ github.repository_owner }}

          for REPO_NAME in $REPOS; do
            TARGET_DIR="../$REPO_NAME"
            echo "Processing $REPO_NAME..."

            # Clone the target repository
            gh repo clone "$OWNER/$REPO_NAME" "$TARGET_DIR"
            cd "$TARGET_DIR" || continue

            # Copy the configuration files from the source repo to the target repo's root
            cp -f ../${{ github.event.repository.name }}/.github/dependabot.yml .github/dependabot.yml
            cp -f ../${{ github.event.repository.name }}/.deepsource.toml .deepsource.toml
            cp -f ../${{ github.event.repository.name }}/.sourcery.yaml .sourcery.yaml


            # Stage and commit changes
            git add .github/dependabot.yml .deepsource.toml .sourcery.yaml
            
            # Check if there are changes to commit
            if git status | grep -q "Changes to be committed"; then
              git commit -m "feat(config): Standardize CI config via sync workflow"
              # Push directly to the default branch (e.g., main or master)
              git push origin HEAD
              echo "Pushed changes to $REPO_NAME"
            else
              echo "No changes needed in $REPO_NAME, skipping push."
            fi

            # Go back to the runner's home directory for the next loop iteration
            cd -
          done
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
