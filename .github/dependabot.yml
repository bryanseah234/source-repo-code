version: 2
updates:
  # .NET SDK (global.json file)
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Bun (bun.lockb, package.json files)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Bundler (Gemfile, Gemfile.lock files)
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Cargo (Cargo.toml, Cargo.lock files)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Composer (composer.json, composer.lock files)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Conda (environment.yml file)
  - package-ecosystem: "conda"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Dev containers (.devcontainer.json file)
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Docker (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Docker Compose (docker-compose.yml file)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # GitHub Actions workflows (.github/workflows/*.yml files)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"
    labels:
      - "dependencies"
      - "github-actions"

  # Go modules (go.mod file)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Gradle (build.gradle, build.gradle.kts files)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Helm (Chart.yaml, values.yaml files)
  - package-ecosystem: "helm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Maven (pom.xml file)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # npm (package.json, package-lock.json files)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "15:00"
      day: "monday"
    # Only auto-update patch versions for packages that affect build config.
    # Major/minor bumps for these packages often require manual config changes
    # (e.g. tailwindcss v4 moved its PostCSS plugin, vue-router v5 needs pinia v3).
    groups:
      patch-safe:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "vue"
          - "vue-router"
          - "pinia"
          - "vite"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "typescript"
    ignore:
      # These packages have historically caused breaking config changes on major bumps.
      # Dependabot will still open PRs but they won't auto-merge (build check gates them).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pinia"
        update-types: ["version-update:semver-major"]

  # NuGet (.nuspec, .csproj, etc. files)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # pip (requirements.txt, Pipfile, setup.py files)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"

  # Terraform (.tf files)
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"
